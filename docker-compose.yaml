services:
  app:
    build: .
    ports: 
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TESTFAGPROVE_DB_DSN=postgres://postgres:postgres@db:5432/testfagprove?sslmode=disable
    
  db:
    image: "postgres:16.0-alpine3.18"
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=testfagprove
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: